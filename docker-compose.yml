version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: farmapp
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: farmapp
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
